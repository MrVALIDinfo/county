<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060B" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#E8F1F6" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>County</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <button id="back" class="icon-btn" aria-label="Back" hidden></button>
  <h1 id="title"></h1>
  <div class="tools" id="tools"></div>
</header>
<main id="app"></main>
<button id="fab-chat" class="fab" aria-label="Assistant"></button>
<button id="fab-scan" class="fab-scan" aria-label="Scan"></button>
<input id="photo" type="file" accept="image/*" capture="environment" hidden>
<div id="scan-toast" class="toast" role="status" hidden></div>
<nav id="nav" class="nav" aria-label="Main"></nav>

<section id="chat" class="sheet" role="dialog" aria-modal="true" aria-label="Assistant" hidden>
  <header class="sheet-head">
    <div class="avatar" id="chat-avatar"></div>
    <div class="grow"><b id="chat-title"></b><div class="muted" id="chat-sub"></div></div>
    <button id="chat-close" class="icon-btn" aria-label="Close"></button>
  </header>
  <div id="chatlist" class="chat-body" role="log" aria-live="polite"></div>
  <footer class="sheet-foot">
    <div class="chips" id="chips"></div>
    <form id="chatform">
      <input id="chatin" autocomplete="off" aria-label="message">
      <button type="button" id="mic" class="icon-btn round" aria-label="Voice"></button>
      <button class="btn round" id="sendbtn" aria-label="Send"></button>
    </form>
  </footer>
</section>

<script src="content.js"></script>
<script src="app.js"></script>
<script src="merchants_zh.js"></script>
<script src="bench.js"></script>
<script src="trust.js"></script>
<script src="insights.js"></script>
<script src="voicedemo.js"></script>
<script src="invest2.js"></script>
<script src="auth.js"></script>
<script src="learn.js"></script>
</body>
</html>
